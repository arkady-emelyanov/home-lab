# At the repository root, with every path relative to it, so ansible,
# ansible-playbook and ansible-lint all find the same configuration no matter
# which is run or from where.
[defaults]
inventory          = inventory
roles_path         = roles
# Secrets are read from the KeePassXC database by a lookup that lives here, so
# they are never written to disk. See lookup_plugins/keepass.py.
lookup_plugins     = lookup_plugins
collections_path   = .ansible/collections
interpreter_python = auto_silent
host_key_checking  = True
force_handlers     = True

result_format         = yaml
display_skipped_hosts = False


[ssh_connection]
pipelining = True
# Connection details come from ~/.ssh/config, which ssh reads on its own. Do not
# add -F ~/.ssh/config: these arguments are passed as argv, not through a shell,
# so the ~ would arrive literal and ssh would fail to open it.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

[privilege_escalation]
# Everything runs as root: on the hypervisor because pct and the bind-mount
# permission check require it, and inside containers because a container's root
# is not the host's root. There is nothing to escalate and no sudo to install.
become = False
