---
# One play per tenant. Each creates its container if absent, brings it up, finds
# the address DHCP gave it, and configures what runs inside.
#
#   make tenants
#   make tenants TENANT=nas
#
# gather_facts is deferred: the container may not exist yet when the play
# starts, and the lxc role is what makes it reachable.
#
# A tenant with tenant_enabled false is not installed: the play ends before any
# role runs. pre_tasks are the only place this check works, because roles would
# otherwise have already created the container.
#
# `| bool` is not decoration: a non-empty string is truthy in Jinja, so the
# string "false" -- what you get from `-e tenant_enabled=false`, or from
# quoting it in YAML -- would otherwise read as on.
- name: Samba fileserver, known on the network as nas
  hosts: samba
  gather_facts: false
  pre_tasks:
    - name: Skip samba when it is turned off
      ansible.builtin.meta: end_host
      when: not (tenant_enabled | bool)
  roles:
    - role: lxc
    - role: tenant_ssh
    - role: samba

