---
# Proves the keepass lookup can reach every entry the roles need, without
# printing any of them. One passphrase prompt, then a length per entry: enough
# to tell "it came back" from "it came back empty", and nothing more.
#
# The identity/ and tunnel-id entries are not credentials. They are here because
# a converge fails on a missing one exactly as it fails on a missing password,
# so the thing worth proving is the same: it is readable before a run needs it.
#
#   ansible-playbook playbooks/secrets-check.yml
- name: Check every secret is reachable
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    entries:
      - backups/backblaze.yaml
      - backups/restic-password.txt
      - cloudflare/token.txt
      - cloudflare/tunnel-credentials.json
      - filebrowser/admin-password.txt
      - filebrowser/tunnel-credentials.json
      - filebrowser/tunnel-id
      - identity/domain
      - identity/email
      - identity/mail-to
      - immich/db-password.txt
      - immich/tunnel-credentials.json
      - immich/tunnel-id
      - miniflux/admin-password.txt
      - miniflux/db-password.txt
      - miniflux/tunnel-credentials.json
      - miniflux/tunnel-id
      - mail/smtp-password.txt
      - qbittorrent/password.txt
      - site/tunnel-id
      - wireguard/wg0.conf
      - wireguard-server/server.key
      - wireguard-server/server.pub
      - wireguard-server/clients/phone.conf
      - wireguard-server/clients/phone.ip
      - wireguard-server/clients/phone.key
      - wireguard-server/clients/phone.psk
      - wireguard-server/clients/phone.pub
  tasks:
    - name: Read each one
      ansible.builtin.set_fact:
        lengths: >-
          {{ lengths | default([]) + [item ~ ' = ' ~ lookup('keepass', item) | length ~ ' chars'] }}
      loop: "{{ entries }}"
      no_log: true

    - name: Report the sizes only
      ansible.builtin.debug:
        var: lengths
