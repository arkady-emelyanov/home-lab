---
# The hypervisor is named after its ~/.ssh/config entry, so the address, account
# and key live in one place outside this repository.
#
# Tenants are identified by vmid and hostname only. They run on DHCP, and their
# address is discovered from the hypervisor at run time -- see roles/lxc. The
# `ansible_host` left unset here is filled in during the play.
all:
  children:
    pve:
      hosts:
        proxmox: {}

    # Every tenant that exists. Whether one is built is not decided here: each
    # carries tenant_enabled in its own host_vars, defaulting to true in
    # group_vars/tenants.yml. Set it false there to leave a tenant alone --
    # commenting a line out here would also hide it from `make tenants
    # TENANT=...` and from anything that reads the inventory.
    tenants:
      hosts:
        samba: {}
        jellyfin: {}
        blocky: {}
        qbittorrent: {}
        site: {}
        wireguard: {}
        immich: {}
        proxy: {}
        miniflux: {}
        gatus: {}
        filebrowser: {}
