---
- name: Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Schedule the self-tests
  ansible.builtin.template:
    src: smartd.conf.j2
    dest: /etc/smartd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart smartd

- name: Start smartd
  ansible.builtin.systemd_service:
    name: smartmontools
    state: started
    enabled: true
