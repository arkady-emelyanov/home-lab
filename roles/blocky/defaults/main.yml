---
# Blocky: DNS proxy and ad blocker. The container is declared in
# inventory/host_vars/blocky.yml.
#
# Chosen over AdGuard Home and Pi-hole for one reason that matters here: it has
# no web UI. Its entire configuration is the file this role templates, so
# nothing rewrites it behind Ansible's back. AdGuard Home owns its YAML at
# runtime and rewrites it on every UI change -- edits made while it runs are
# simply lost -- which would make this repository a second, losing source of
# truth.
#
# The LAN depends on this container for name resolution. That is accepted: the
# filtering is the point, and it is why the config is reproducible from here
# rather than clicked into a UI.

blocky_version: "0.35.0"
blocky_arch: x86_64
# Verified against the published checksum, so a tampered or truncated download
# fails rather than installing. Update when the version changes:
#   curl -sSL https://github.com/0xERR0R/blocky/releases/download/v<ver>/blocky_checksums.txt
blocky_sha256: "97ae4257e4f2ea7ee4e0622fca152019eb92224d81b41b2549f064e4cef5584e"

blocky_user: blocky
blocky_install_dir: /opt/blocky
blocky_config_dir: /etc/blocky

# Upstream resolvers, over DoT so queries leaving the network are encrypted.
# parallel_best races them and takes the first answer.
blocky_upstreams:
  - tcp-tls:1.1.1.1:853
  - tcp-tls:9.9.9.9:853
blocky_upstream_strategy: parallel_best

# Resolves the upstreams' own hostnames and the blocklist URLs, before
# encrypted DNS is available to do it. Plain UDP by necessity.
blocky_bootstrap_dns: tcp+udp:1.1.1.1

blocky_dns_port: 53
# Metrics, health and the REST API. Not a UI; nothing writes config through it.
blocky_http_port: 4000

# --- Local names -----------------------------------------------------------
#
# The router keeps DHCP and holds a reservation per container, keyed to the
# fixed MAC in each host_vars file. These map those addresses to names, so the
# names live in git rather than in the router.
#
# Keep these in step with the reservations: nothing checks that they agree, and
# a stale entry here resolves to the wrong host rather than failing.
#
# A value may be a list, which round-robins. A name pointing at another name is
# written as a CNAME target rather than an address.
#
# .home is not formally reserved the way .internal and home.arpa are, but ICANN
# indefinitely deferred its delegation in 2018 and refunded every applicant --
# it was one of the two most-queried undelegated TLDs at the root, precisely
# because private networks already used it. Nobody else will ever get it.
#
# Not .local: RFC 6762 reserves that for mDNS, and the samba tenant publishes
# nas.local through Avahi. A unicast zone of the same name would fight it.
# The three web services resolve to the reverse proxy, not to themselves, so
# they answer on port 80 by name. Reaching one on its own port means using its
# address: the name now arrives at the proxy first.
#
# proxmox and nas are not proxied -- 8006 is HTTPS with its own certificate,
# and SMB is not HTTP at all.
blocky_custom_dns:
  proxmox.home: 192.168.0.12
  nas.home: 192.168.0.41
  jellyfin.home: 192.168.0.47
  qbittorrent.home: 192.168.0.47
  photos.home: 192.168.0.47
  rss.home: 192.168.0.47
  health.home: 192.168.0.47
  proxy.home: 192.168.0.47
  blocky.home: 192.168.0.40
blocky_custom_ttl: 1h

# Alternative to the above, for a domain the router already resolves: hand those
# queries to it instead of maintaining names here. Empty because the addresses
# above are explicit on purpose.
#   blocky_conditional_mapping: {home: 192.168.0.1}
#   blocky_conditional_rewrite: {lan: home}
blocky_conditional_mapping: {}
blocky_conditional_rewrite: {}

# Blocklists, fetched on start and re-downloaded on the interval below -- so
# they stay current without anything being done by hand.
#
# This is Firebog's "ticked" set: the lists they mark as low false-positive,
# which is the defensible answer to "all of them". Every URL was checked for
# reachability and entry count before being added here. Roughly 690k entries
# before de-duplication.
#
# Grouped by what they block, so a group can be paused on its own when
# something breaks:
#   curl "http://<blocky>:4000/api/blocking/disable?duration=5m&groups=tracking"
blocky_denylists:
  # Domains that are suspicious rather than definitively bad.
  suspicious:
    - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
    - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Spam/hosts
    - https://v.firebog.net/hosts/static/w3kbl.txt

  ads:
    - https://adaway.org/hosts.txt
    - https://v.firebog.net/hosts/AdguardDNS.txt
    - https://v.firebog.net/hosts/Admiral.txt
    - https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
    - https://v.firebog.net/hosts/Easylist.txt
    - https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext
    - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/UncheckyAds/hosts
    - https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts

  # EasyPrivacy is the one most likely to take out something you wanted -- some
  # sites will not render without their analytics endpoint. It is why tracking
  # is a separate group rather than folded into ads.
  tracking:
    - https://v.firebog.net/hosts/Easyprivacy.txt
    - https://v.firebog.net/hosts/Prigent-Ads.txt
    - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.2o7Net/hosts
    - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
    - https://hostfiles.frogeye.fr/firstparty-trackers-hosts.txt
    # Not part of Firebog's set, but narrow and safe.
    - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt
    - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/android-tracking.txt

  malware:
    - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
    - https://v.firebog.net/hosts/Prigent-Crypto.txt
    - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Risk/hosts
    - https://phishing.army/download/phishing_army_blocklist_extended.txt
    - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt
    - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt
    - https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/hosts
    - https://urlhaus.abuse.ch/downloads/hostfile/
    - https://lists.cyberhost.uk/malware.txt

blocky_refresh_period: 24h

# Names never blocked, whatever a list says. A blocklist taking out something
# the house depends on is the usual way this service ruins an evening.
blocky_allowlists: {}

# Answers served from memory rather than re-asked upstream.
blocky_cache_min: 5m
blocky_cache_max: 30m
blocky_cache_prefetching: true

blocky_log_level: info
