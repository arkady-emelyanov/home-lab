---
- name: Create the filebrowser account
  # It only reads the share, and the share tree is 0775/0664, so it needs no
  # share id of its own.
  ansible.builtin.user:
    name: filebrowser
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install FileBrowser
  ansible.builtin.get_url:
    url: "{{ filebrowser_url }}"
    dest: /usr/local/bin/filebrowser
    checksum: "sha256:{{ filebrowser_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart filebrowser

- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/filebrowser
    state: directory
    owner: root
    group: filebrowser
    mode: "0750"

- name: Configure FileBrowser
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/filebrowser/config.yaml
    owner: root
    group: filebrowser
    mode: "0640"
  notify: Restart filebrowser

- name: Write the admin password
  # An environment file rather than the config, so the config holds no secret.
  ansible.builtin.copy:
    content: "FILEBROWSER_ADMIN_PASSWORD={{ lookup('keepass', filebrowser_admin_password_entry) }}\n"
    dest: /etc/filebrowser/env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart filebrowser

- name: Install the unit
  ansible.builtin.template:
    src: filebrowser.service.j2
    dest: /etc/systemd/system/filebrowser.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart filebrowser

- name: Start FileBrowser
  ansible.builtin.systemd_service:
    name: filebrowser
    state: started
    enabled: true
    daemon_reload: true

# --- The tunnel -------------------------------------------------------------

- name: Install cloudflared
  ansible.builtin.get_url:
    url: >-
      https://github.com/cloudflare/cloudflared/releases/download/{{ filebrowser_cloudflared_version }}/cloudflared-linux-amd64
    dest: /usr/local/bin/cloudflared
    checksum: "sha256:{{ filebrowser_cloudflared_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart cloudflared

- name: Create the cloudflared account
  ansible.builtin.user:
    name: cloudflared
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the cloudflared configuration directory
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: cloudflared
    mode: "0750"

- name: Install the tunnel credentials
  ansible.builtin.copy:
    content: "{{ lookup('keepass', filebrowser_tunnel_credentials_entry) }}"
    dest: /etc/cloudflared/credentials.json
    owner: root
    group: cloudflared
    mode: "0640"
  no_log: true
  notify: Restart cloudflared

- name: Configure the tunnel
  ansible.builtin.template:
    src: cloudflared-config.yml.j2
    dest: /etc/cloudflared/config.yml
    owner: root
    group: cloudflared
    mode: "0640"
  notify: Restart cloudflared

- name: Install the tunnel unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudflared

- name: Start the tunnel
  ansible.builtin.systemd_service:
    name: cloudflared
    state: started
    enabled: true
    daemon_reload: true

- name: Read the Cloudflare token
  ansible.builtin.set_fact:
    filebrowser_cf_token: "{{ lookup('keepass', filebrowser_cf_token_entry) }}"
  delegate_to: localhost
  no_log: true

- name: Find the zone
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ filebrowser_domain.split('.')[-2:] | join('.') }}"
    headers:
      Authorization: "Bearer {{ filebrowser_cf_token }}"
  delegate_to: localhost
  register: filebrowser_zone
  no_log: true

- name: Publish the tunnel CNAME for {{ filebrowser_domain }}
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ filebrowser_zone.json.result[0].id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ filebrowser_cf_token }}"
    body_format: json
    body:
      type: CNAME
      name: "{{ filebrowser_domain }}"
      content: "{{ filebrowser_tunnel_id }}.cfargotunnel.com"
      proxied: true
      ttl: 1
    status_code: [200, 400]
  delegate_to: localhost
  register: filebrowser_dns
  changed_when: filebrowser_dns.status == 200
  failed_when: >-
    filebrowser_dns.status == 400
    and 'already exists' not in (filebrowser_dns.json.errors | map(attribute='message') | join(' '))
  no_log: true
