---
- name: Create the filebrowser account
  # It only reads the share, and the share tree is 0775/0664, so it needs no
  # share id of its own.
  ansible.builtin.user:
    name: filebrowser
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install FileBrowser
  ansible.builtin.get_url:
    url: "{{ filebrowser_url }}"
    dest: /usr/local/bin/filebrowser
    checksum: "sha256:{{ filebrowser_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart filebrowser

- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/filebrowser
    state: directory
    owner: root
    group: filebrowser
    mode: "0750"

- name: Configure FileBrowser
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/filebrowser/config.yaml
    owner: root
    group: filebrowser
    mode: "0640"
  notify: Restart filebrowser

- name: Write the admin password
  # An environment file rather than the config, so the config holds no secret.
  ansible.builtin.copy:
    content: "FILEBROWSER_ADMIN_PASSWORD={{ lookup('keepass', filebrowser_admin_password_entry) }}\n"
    dest: /etc/filebrowser/env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart filebrowser

- name: Install the unit
  ansible.builtin.template:
    src: filebrowser.service.j2
    dest: /etc/systemd/system/filebrowser.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart filebrowser

- name: Start FileBrowser
  ansible.builtin.systemd_service:
    name: filebrowser
    state: started
    enabled: true
    daemon_reload: true
