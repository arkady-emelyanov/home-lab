---
# nginx behind a Cloudflare tunnel.
#
# The tunnel dials out, so there is no forwarded port, nothing listening on the
# WAN, and no certificate to manage: TLS terminates at Cloudflare's edge with
# their own publicly trusted certificate, and the hop from there to here is the
# tunnel, which is already TLS. A Cloudflare Origin Certificate is for the other
# arrangement, where Cloudflare connects inbound to a public address; there is
# no inbound connection here, so there is nothing to present one to.

site_domain: "{{ public_domain }}"

# The links under the name. Public profiles, and the repository already lives
# under the first, so they say nothing the repository does not.
site_github_url: https://github.com/arkady-emelyanov/
site_linkedin_url: https://www.linkedin.com/in/arkadii-emelianov/

# Locally managed, not token-managed. A tunnel run with --token takes its
# configuration from the Cloudflare dashboard and ignores config.yml, which
# would put the ingress rules somewhere this repository cannot describe. With a
# credentials file the rules live below, in git, like everything else.
site_tunnel_id: "{{ lookup('keepass', site_tunnel_id_entry) }}"
site_tunnel_id_entry: site/tunnel-id
site_tunnel_credentials_entry: cloudflare/tunnel-credentials.json
site_tunnel_credentials_path: /etc/cloudflared/credentials.json
site_config_path: /etc/cloudflared/config.yml

# Pinned. cloudflared is the thing standing between the internet and this
# container; it should change when someone decides it changes.
site_cloudflared_version: "2026.9.3"
# The digest GitHub publishes for the release asset. It is also what makes a
# version bump take effect: without a checksum get_url keeps any file already
# at the destination.
site_cloudflared_sha256: "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2"

# nginx binds the loopback only. The single path in is the tunnel, which runs
# in this same container, so there is no reason for the listener to be visible
# even on the LAN.
site_nginx_address: 127.0.0.1
site_nginx_port: 8080

site_root: /var/www/site

# The projects page: a subdomain served by the same nginx through the same tunnel.
# Built on the control machine from files/projects/ -- Markdown in, one static page
# out -- so nothing on this tenant needs Python or the Markdown package.
site_projects_domain: "projects.{{ site_domain }}"
site_projects_root: /var/www/projects

# The blog: built and served by GitHub Pages, not by this container. Only its
# DNS is here, beside the other public names in the zone. The record is DNS-only,
# unlike the tunnel's: GitHub issues the certificate itself and has to see its own
# address to do it. The Pages host is the account's, which site_github_url names
# already.
site_blog_domain: "blog.{{ site_domain }}"
site_blog_pages_host: arkady-emelyanov.github.io
# The verified-domain challenge, which stops another GitHub account claiming a name
# in the zone while Pages is off. GitHub shows the value once, under the account's
# Settings -> Pages; it names the account and so is kept with the identity values.
site_blog_challenge_name: "_github-pages-challenge-arkady-emelyanov.{{ site_domain }}"
site_blog_challenge_entry: site/github-pages-challenge

# The Earth scene's satellites: a timer on the container fetches CelesTrak's
# orbital elements and writes what the page needs to one file it serves. CelesTrak
# refreshes every two hours and asks not to be asked more often, so the timer runs
# at that pace and a group fetched less than two hours ago is not fetched again --
# which also keeps a converge right after a timer run off the network.
site_satellites_user: site-satellites
site_satellites_state: /var/lib/site-satellites
site_satellites_script: /usr/local/libexec/site-satellites.py
site_satellites_output: "{{ site_root }}/data/sats.json"
site_satellites_interval: 2h
site_satellites_refetch_after: 6600
# [group, kind]: the kind is how the page colours it -- 0 Starlink, 1 the other
# broadband constellations, 2 navigation, 3 geostationary, 4 space stations, 5 the
# rest. A satellite in several groups takes its first, so the specific ones lead.
site_satellites_groups:
  - [stations, 4]
  - [gnss, 2]
  - [starlink, 0]
  - [oneweb, 1]
  - [kuiper, 1]
  - [qianfan, 1]
  - [geo, 3]
  - [intelsat, 3]
  - [ses, 3]
  - [weather, 5]
  - [goes, 5]
  - [science, 5]
  - [resource, 5]
  - [sarsat, 5]
  - [iridium-NEXT, 5]
  - [globalstar, 5]
  - [orbcomm, 5]
  - [planet, 5]
  - [spire, 5]
  - [amateur, 5]
  - [cubesat, 5]
  - [education, 5]
  - [military, 5]
  - [radar, 5]
  - [other-comm, 5]

# The DNS record is created from the machine running Ansible, not from the
# container. A public-facing tenant has no business holding a token that can
# rewrite the zone's DNS -- it only ever needs its tunnel credentials.
site_cf_token_entry: cloudflare/token.txt
