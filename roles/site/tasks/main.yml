---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install cloudflared
  ansible.builtin.get_url:
    url: >-
      https://github.com/cloudflare/cloudflared/releases/download/{{ site_cloudflared_version }}/cloudflared-linux-amd64
    dest: /usr/local/bin/cloudflared
    checksum: "sha256:{{ site_cloudflared_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart cloudflared

- name: Create the cloudflared account
  # No shell and no home: it runs one process and reads one file.
  ansible.builtin.user:
    name: cloudflared
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the cloudflared configuration directory
  ansible.builtin.file:
    path: "{{ site_config_path | dirname }}"
    state: directory
    owner: root
    group: cloudflared
    mode: "0750"

- name: Install the tunnel credentials
  ansible.builtin.copy:
    content: "{{ lookup('keepass', site_tunnel_credentials_entry) }}"
    dest: "{{ site_tunnel_credentials_path }}"
    owner: root
    group: cloudflared
    mode: "0640"
  no_log: true
  notify: Restart cloudflared

- name: Configure the tunnel
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ site_config_path }}"
    owner: root
    group: cloudflared
    mode: "0640"
  notify: Restart cloudflared

- name: Create the document root
  ansible.builtin.file:
    path: "{{ site_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: content

- name: Install the page
  # A static file, like the favicon: nginx reads it off the disk on every
  # request, so there is nothing to reload when it changes.
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ site_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  tags: content

- name: Install the scenes and the engine that draws them
  # Static files, like the page: nginx serves them straight off the disk.
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ site_root }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  loop:
    - engine.js
    - scenes
  tags: content

- name: Create the satellites account
  # No shell and no home: it runs one script on a timer.
  ansible.builtin.user:
    name: "{{ site_satellites_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the data directory
  # The one place in the document root the job may write.
  ansible.builtin.file:
    path: "{{ site_satellites_output | dirname }}"
    state: directory
    owner: "{{ site_satellites_user }}"
    group: "{{ site_satellites_user }}"
    mode: "0755"

- name: Install the satellites job
  ansible.builtin.template:
    src: satellites.py.j2
    dest: "{{ site_satellites_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the satellites units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/site-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - satellites.service
    - satellites.timer

- name: Refresh the satellites now
  # Run once during the converge, through the unit and so as its account and in
  # its sandbox, rather than waiting for the timer: a job that cannot reach
  # CelesTrak or write its file fails here, where someone is watching. Groups
  # fetched in the last two hours are not asked for again, so this does not
  # count against CelesTrak's limit.
  ansible.builtin.systemd_service:
    name: site-satellites.service
    state: started
    daemon_reload: true
  changed_when: false

- name: Enable the satellites timer
  ansible.builtin.systemd_service:
    name: site-satellites.timer
    state: started
    enabled: true

- name: Install the favicon
  # A static file: nginx serves it straight off the disk, so there is nothing
  # to reload when it changes.
  ansible.builtin.template:
    src: favicon.svg.j2
    dest: "{{ site_root }}/favicon.svg"
    owner: root
    group: root
    mode: "0644"
  tags: content

- name: Build and install the projects page
  tags: content
  block:
    - name: Make a place to build the projects page
      ansible.builtin.tempfile:
        state: directory
        suffix: .projects
      delegate_to: localhost
      register: site_projects_build
      changed_when: false

    - name: Build the projects page
      # On the control machine, with this repository's own interpreter: Markdown
      # is in its virtualenv and has no business on a public-facing tenant. The
      # links are passed in, so the sources name no domain.
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/projects/build.py"
          - "{{ site_projects_build.path }}/out"
          - --home
          - "https://{{ site_domain }}/"
          - --projects
          - "https://{{ site_projects_domain }}/"
          - --github
          - "{{ site_github_url }}"
          - --linkedin
          - "{{ site_linkedin_url }}"
      delegate_to: localhost
      changed_when: false

    - name: Create the projects document root
      ansible.builtin.file:
        path: "{{ site_projects_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the projects page
      # Static files, like the front page. copy compares checksums, so an
      # unchanged build reports no change; it does not remove files the build
      # stopped producing.
      ansible.builtin.copy:
        src: "{{ site_projects_build.path }}/out/"
        dest: "{{ site_projects_root }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Install llms.txt on the front page too
      # Built with the projects page, since it lists them, and served from both
      # names so an agent that lands on either finds it.
      ansible.builtin.copy:
        src: "{{ site_projects_build.path }}/out/llms.txt"
        dest: "{{ site_root }}/llms.txt"
        owner: root
        group: root
        mode: "0644"
  always:
    - name: Remove the build directory
      ansible.builtin.file:
        path: "{{ site_projects_build.path }}"
        state: absent
      delegate_to: localhost
      changed_when: false
      when: site_projects_build.path is defined

- name: Install robots.txt on both sites
  ansible.builtin.template:
    src: robots.txt.j2
    dest: "{{ item }}/robots.txt"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ site_root }}"
    - "{{ site_projects_root }}"
  tags: content

- name: Remove the default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/site.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/site.conf
    dest: /etc/nginx/sites-enabled/site.conf
    state: link
    owner: root
    group: root
  notify: Reload nginx

- name: Install the tunnel unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudflared

- name: Start nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true

- name: Start the tunnel
  ansible.builtin.systemd_service:
    name: cloudflared
    state: started
    enabled: true
    daemon_reload: true

- name: Read the Cloudflare token
  ansible.builtin.set_fact:
    site_cf_token: "{{ lookup('keepass', site_cf_token_entry) }}"
  delegate_to: localhost
  no_log: true

- name: Find the zone
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ site_domain }}"
    headers:
      Authorization: "Bearer {{ site_cf_token }}"
  delegate_to: localhost
  register: site_zone
  no_log: true

- name: Remember the zone id
  ansible.builtin.set_fact:
    site_zone_id: "{{ site_zone.json.result[0].id }}"
  no_log: true

- name: Publish the tunnel CNAME for {{ site_domain }}
  # A CNAME to the tunnel rather than an address record: there is no address to
  # publish. Proxied, because this one is HTTP and the proxy is what terminates
  # TLS -- the opposite of the `home` record, which must stay DNS-only.
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ site_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ site_cf_token }}"
    body_format: json
    body:
      type: CNAME
      name: "{{ item }}"
      content: "{{ site_tunnel_id }}.cfargotunnel.com"
      proxied: true
      ttl: 1
    status_code: [200, 400]
  delegate_to: localhost
  register: site_dns
  changed_when: site_dns.status == 200
  failed_when: >-
    site_dns.status == 400
    and 'already exists' not in (site_dns.json.errors | map(attribute='message') | join(' '))
  loop:
    - "{{ site_domain }}"
    - "www.{{ site_domain }}"
    - "{{ site_projects_domain }}"
  no_log: true
