---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Restrict what may install itself
  ansible.builtin.template:
    src: 52nas-next.j2
    dest: /etc/apt/apt.conf.d/52nas-next
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump

- name: Turn the daily run on
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump

- name: Enable the timers that drive it
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
