---
# The container template ships openssh-server enabled
# (/etc/systemd/system/multi-user.target.wants/ssh.service), so a tenant boots
# with it listening. It is kept -- Ansible reaches tenants over it and it is the
# interactive way in -- but hardened immediately, and the management key is
# already authorised because `pct create --ssh-public-keys` put it there.

- name: Install the locale definitions
  # Debian's sshd accepts LANG and LC_* from the client, and a workstation
  # sending en_US.UTF-8 to a host that never generated it makes every shell,
  # and every perl script a package runs, open with a locale warning. The noise
  # is harmless but it lands in front of command output -- including, once, in
  # front of an Ansible module's JSON, which then failed to parse.
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Generate the locale the client asks for
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Empty the static message of the day
  # sshd already has PrintMotd no -- on Debian it is pam_motd in
  # /etc/pam.d/sshd that prints this, so turning it off in sshd_config does
  # nothing. Emptying the file is what actually silences it.
  ansible.builtin.copy:
    content: ""
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"

- name: Find the dynamic motd scripts
  ansible.builtin.find:
    paths: /etc/update-motd.d
    file_type: file
  register: tenant_ssh_motd_scripts

- name: Stop the dynamic motd scripts running
  # Left in place, just not executable: run-parts skips them, and an upgrade
  # that adds a new one is visible as a change here rather than silently
  # reinstating the banner.
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0644"
  loop: "{{ tenant_ssh_motd_scripts.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Detect whether sshd is socket-activated
  # Debian 13 enables ssh.socket, so systemd holds port 22 and sshd inherits the
  # descriptor. A SIGHUP -- what `reload` sends -- makes sshd re-exec and try to
  # bind the port itself, which fails and takes the service down.
  ansible.builtin.systemd_service:
    name: ssh.socket
  register: tenant_ssh_socket
  changed_when: false
  failed_when: false
  check_mode: false

- name: Apply the sshd policy
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload tenant sshd
