---
# Mechanism only. Every value below is stated literally in the tenant's own
# role -- there is no tenant map and nothing loops over tenants.
#
# Required of the caller:
#   lxc_vmid       from inventory
#   lxc_hostname   container hostname
#   lxc_cores, lxc_memory, lxc_disk
#   lxc_mounts     list of {host, path, ro} for a bind mount from the pool,
#                  or {volume, path, ro} for storage PVE allocates and owns
#   lxc_devices    list of {path, gid}
#
lxc_mounts: []
lxc_devices: []

# Unprivileged: container root maps to an unprivileged host uid, so an escape
# lands on a nobody account rather than on host root. Privileged containers are
# not a security boundary at all.
lxc_unprivileged: true
lxc_onboot: true

# Debian 13 ships systemd 257, which mounts /tmp, /run/lock and /dev/mqueue as
# filesystems of its own and wants the namespaces behind PrivateTmp and
# ProtectSystem. An unprivileged container cannot do any of that without this,
# so without it every container boots `degraded`: /tmp is a plain directory on
# the root disk rather than a tmpfs, /run/lock is never set up, and machine-id
# stays transient and is regenerated on every boot. `pct start` warns about it.
#
# Nesting is not a hole in the unprivileged boundary -- it permits mounts and
# user namespaces *inside* the container's own id range, which is still mapped
# to unprivileged host uids. It is what Proxmox itself tells you to enable.
lxc_features: nesting=1

# Map the share id straight through instead of shifting it by 100000, so a
# container writing to a bind mount produces files the host sees with the share
# tree's own ownership -- without chowning the data or going privileged.
lxc_idmap:
  - "u 0 100000 {{ share_uid }}"
  - "u {{ share_uid }} {{ share_uid }} 1"
  - "u {{ share_uid + 1 }} {{ 100000 + share_uid + 1 }} 1"
  - "g 0 100000 {{ share_gid }}"
  - "g {{ share_gid }} {{ share_gid }} 1"
  - "g {{ share_gid + 1 }} {{ 100000 + share_gid + 1 }} 1"

# How long to wait for DHCP after first start.
lxc_address_retries: 30
lxc_address_delay: 2
