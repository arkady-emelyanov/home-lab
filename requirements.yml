---
# Collections are downloaded artifacts, not source: they install into
# collections/ (gitignored) and are pinned here so a fresh checkout resolves to
# the same code.
#
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: ansible.posix
    version: "2.1.0"
  - name: community.general
    version: "11.4.0"
